spring:
  application:
    name: productos-ferreteria
  datasource:
    url: jdbc:mysql://192.168.1.10:3306/ferreteria_db?serverTimezone=UTC
    username: roberto
    password: root
  jpa:
    hibernate:
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ContactosReino
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
server:
  port: 8000
keycloak:
  clientId: login
eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:admeureka123@localhost:8761/eureka
